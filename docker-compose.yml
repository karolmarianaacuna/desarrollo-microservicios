version: '3.8'

services:
  # 🟢 Base de datos PostgreSQL
  db:
    image: postgres:16
    container_name: microservicio-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: usuarios_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - micro_net

  # 🟢 Microservicio de autenticación (Node.js)
  auth-service:
    build: ./microservicio-auth
    container_name: microservicio-auth
    ports:
      - "4000:4000"
   
    environment:
      - DB_HOST=db
      - DB_USER=admin
      - DB_PASSWORD=admin
      - DB_DATABASE=usuarios_db
      - DB_PORT=5432
    depends_on:
      - db
    volumes:
      - ./microservicio-auth:/app
      - /app/node_modules
    networks:
      - micro_net

  # 🔵 Microservicio frontend principal (Nginx)
  frontend-service:
    build: ./microservicio-frontend
    container_name: microservicio-frontend
    ports:
      - "8080:80"
    depends_on:
      - auth-service
    networks:
      - micro_net

  # 🟣 Nuevo microservicio del juego (Nginx)
  juego-service:
    build: ./hackaton       # 👈 Ajusta si tiene otro nombre
    container_name: microservicio-juego
    ports:
      - "8089:8089"                    # 👈 Expuesto en tu Dockerfile
    depends_on:
      - auth-service                   # 👈 Conecta después del auth si lo usa
    networks:
      - micro_net

# 🌐 Red compartida entre todos los microservicios
networks:
  micro_net:
    driver: bridge

# 💾 Volumen persistente para la base de datos
volumes:
  postgres_data:
